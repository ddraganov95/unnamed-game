<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Dungeon - Lobby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lobby-card wide-dashboard">
        <h2 class="lobby-title">DUNGEON GATEWAY</h2>

        <!-- Top Row: Start & Join side-by-side -->
        <div class="top-actions">
            <div class="action-block">
                <label>HOST GAME</label>
                <button id="btn-start" type="button">Start New Game</button>
            </div>

            <div class="action-block">
                <label for="game-id-input">JOIN EXISTING GAME</label>
                <div class="join-row">
                    <input type="text" id="game-id-input" placeholder="Paste Game UUID..." autocomplete="off">
                    <button id="btn-join" type="button">Join</button>
                </div>
            </div>
        </div>

        <div id="error-label"></div>

        <hr class="divider">

        <!-- Tab Controls -->
        <div class="tab-navigation">
            <button type="button" class="tab-btn active" data-tab="tab-chat">CHAT</button>
            <button type="button" class="tab-btn" data-tab="tab-profile">PROFILE</button>
            <button type="button" class="tab-btn" data-tab="tab-achievements">ACHIEVEMENTS</button>
            <button type="button" class="tab-btn" data-tab="tab-leaderboard">LEADERBOARD</button>
        </div>

        <!-- Tab Content Wrapper -->
        <div class="tab-container">
            <!-- CHAT TAB -->
            <div id="tab-chat" class="tab-content active chat-section">
                <div id="chat-box" class="chat-box"></div>
                
                <div class="join-row">
                    <input type="text" id="chat-input" maxlength="70" placeholder="Type a message..." autocomplete="off">
                    <button id="btn-send-chat" type="button">Send</button>
                </div>
            </div>
 
            <!-- PROFILE TAB -->
            <div id="tab-profile" class="tab-content"></div>

            <!-- ACHIEVEMENTS TAB -->
            <div id="tab-achievements" class="tab-content">
                <div id="achievements-grid" class="achievements-grid">
                    <!-- Dynamically populated or template cards -->
                </div>
            </div>

           <!-- LEADERBOARD TAB -->
            <div id="tab-leaderboard" class="tab-content">
                <!-- Pinned Current User Standing -->
                <div id="leaderboard-my-row-container" class="leaderboard-my-row">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>YOUR RANK</th>
                                <th>PLAYER ID</th>
                                <th>HIGHEST SCORE</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-my-tbody">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Main Leaderboard List -->
                <div class="leaderboard-container">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>RANK</th>
                                <th>PLAYER ID</th>
                                <th>HIGHEST SCORE</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-tbody">
                            <!-- Dynamically populated via JavaScript -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Controls -->
                <div class="leaderboard-pagination">
                    <button id="btn-leaderboard-prev" type="button" class="page-btn">PREV</button>
                    <span id="leaderboard-page-indicator">PAGE 1</span>
                    <button id="btn-leaderboard-next" type="button" class="page-btn">NEXT</button>
                </div>
            </div>
        </div>
    </div>

    <script src="lobby.js"></script>
</body>
</html>
